<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Inventario Digital de Medicamentos y Vacunas para Ganado">
    <title>Inventario Ganadero - Medicamentos y Vacunas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-cow"></i>
                    <span>InventarioGanadero</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Principal</div>
                    <button class="nav-item active" data-view="dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-item" data-view="nuevo-registro">
                        <i class="fas fa-plus-circle"></i>
                        <span>Nuevo Registro</span>
                    </button>
                    <button class="nav-item" data-view="stock">
                        <i class="fas fa-boxes-stacked"></i>
                        <span>Stock</span>
                    </button>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Registros</div>
                    <button class="nav-item" data-view="registro-actividades">
                        <i class="fas fa-history"></i>
                        <span>Registro de Actividades</span>
                    </button>
                    <button class="nav-item" data-view="por-caducar">
                        <i class="fas fa-clock"></i>
                        <span>Por Caducar</span>
                        <span class="badge" id="badge-caducar">0</span>
                    </button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">VG</div>
                    <div class="user-details">
                        <div class="user-name">Veterinario Admin</div>
                        <div class="user-role">Administrador</div>
                    </div>
                </div>
                <button type="button" class="btn btn-secondary btn-logout" style="width: 100%; margin-top: 0.75rem;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">Dashboard</h1>
                </div>
                <div class="top-bar-right">
                    <button class="notifications" id="notifications-btn" aria-label="Notificaciones">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div id="view-container">
                    <!-- Views rendered by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js?v=17"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/nuevo-registro.js"></script>
    <script src="js/views/stock.js?v=1"></script>
    <script src="js/views/registro-actividades.js"></script>
    <script src="js/views/por-caducar.js"></script>
    
</body>
</html>
