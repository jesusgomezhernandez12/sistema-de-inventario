<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión - Inventario Ganadero">
    <title>Iniciar Sesión - Inventario Ganadero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--gray-100) 0%, var(--gray-200) 100%);
            padding: 2rem;
        }
        
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--gray-200);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        
        .login-logo {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
        }
        
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            opacity: 0.9;
            font-size: 0.9375rem;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--gray-400);
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon .form-input {
            padding-left: 2.75rem;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }
        
        .btn-login {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
            color: var(--gray-500);
            font-size: 0.875rem;
        }
        
        .login-footer a {
            color: var(--primary);
            font-weight: 500;
        }
        
        .alert {
            padding: 0.875rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.875rem;
        }
        
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #991b1b;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .demo-credentials {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
        }
        
        .demo-credentials summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }
        
        .demo-credentials ul {
            margin: 0;
            padding-left: 1.25rem;
        }
        
        .demo-credentials li {
            margin-bottom: 0.25rem;
            font-family: monospace;
            color: var(--gray-600);
        }
        
        .demo-credentials code {
            background: white;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            border: 1px solid var(--gray-200);
        }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <!-- Configuración Turso -->
    <script>
        window.ENV = {
            TURSO_DATABASE_URL: 'libsql://tu-db-tu-org.turso.io',
            TURSO_AUTH_TOKEN: 'tu-auth-token-aqui'
        };
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-cow"></i>
                </div>
                <h1 class="login-title">Inventario Ganadero</h1>
                <p class="login-subtitle">Sistema de Medicamentos y Vacunas</p>
            </div>
            
            <div class="login-body">
                <div id="alert-container"></div>
                
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="email">Correo Electrónico</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-input" id="email" name="email" placeholder="veterinario@ejemplo.com" required autocomplete="email">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-input" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-login" id="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
                
                <div class="login-footer">
                    <p>¿No tienes cuenta? <a href="#">Contacta al administrador</a></p>
                </div>
                
                <details class="demo-credentials">
                    <summary>Credenciales de demostración</summary>
                    <ul>
                        <li><strong>Admin:</strong> <code>admin@ganadero.com</code> / <code>admin123</code></li>
                        <li><strong>Veterinario:</strong> <code>vet@ganadero.com</code> / <code>vet123</code></li>
                        <li><strong>Técnico:</strong> <code>tecnico@ganadero.com</code> / <code>tecnico123</code></li>
                    </ul>
                </details>
            </div>
        </div>
    </div>

    <script src="js/lib/turso-client.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-login');
            const alertContainer = document.getElementById('alert-container');
            
            // Limpiar alertas previas
            alertContainer.innerHTML = '';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showAlert('Por favor completa todos los campos', 'danger');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Iniciando sesión...';
            
            try {
                // Inicializar App y DB
                window.ENV = window.ENV || {
                    TURSO_DATABASE_URL: 'libsql://tu-db-tu-org.turso.io',
                    TURSO_AUTH_TOKEN: 'tu-auth-token-aqui'
                };
                
                // Cargar bcrypt si no está
                if (typeof bcrypt === 'undefined') {
                    await loadBcrypt();
                }
                
                const db = new TursoClient(window.ENV.TURSO_DATABASE_URL, window.ENV.TURSO_AUTH_TOKEN);
                
                // Buscar usuario
                const user = await db.fetch(
                    'SELECT * FROM usuarios WHERE email = ? AND activo = 1', 
                    [email.toLowerCase()]
                );
                
                if (!user) {
                    throw new Error('Credenciales inválidas');
                }

                // Verificar password
                const valid = await bcrypt.verify(password, user.password);
                if (!valid) {
                    throw new Error('Credenciales inválidas');
                }

                // Actualizar último acceso
                await db.exec(
                    'UPDATE usuarios SET ultimo_acceso = datetime("now") WHERE id = ?', 
                    [user.id]
                );

                // Crear sesión
                const session = {
                    id: user.id,
                    nombre: user.nombre,
                    email: user.email,
                    rol: user.rol,
                    expires: Date.now() + 2 * 60 * 60 * 1000
                };
                
                localStorage.setItem('inventario_session', JSON.stringify(session));
                
                // Redirigir
                window.location.href = 'index.html';
                
            } catch (error) {
                showAlert(error.message, 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
            }
        });
        
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'danger' ? 'exclamation-circle' : 'check-circle'}"></i>
                <span>${message}</span>
            `;
            alertContainer.appendChild(alert);
        }
        
        async function loadBcrypt() {
            return new Promise((resolve, reject) => {
                if (typeof bcrypt !== 'undefined') {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js';
                script.onload = () => {
                    window.bcrypt = bcrypt;
                    resolve();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // Auto-focus email field
        document.getElementById('email').focus();
        
        // Verificar si ya hay sesión
        document.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('inventario_session');
            if (session) {
                try {
                    const user = JSON.parse(session);
                    if (user.expires && Date.now() < user.expires) {
                        window.location.href = 'index.html';
                    }
                } catch {
                    localStorage.removeItem('inventario_session');
                }
            }
        });
    </script>
</body>
</html>
